<svg width="520" height="420" viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf2fb"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c7be5"/>
      <stop offset="100%" stop-color="#1a5fd0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Main Form Card -->
  <rect x="90" y="60" width="260" height="300" rx="16" fill="#ffffff" filter="url(#softShadow)"/>

  <!-- Form header -->
  <rect x="120" y="90" width="200" height="16" rx="8" fill="#d6e4f5"/>

  <!-- Input fields -->
  <rect x="120" y="125" width="200" height="14" rx="7" fill="#eef3f9"/>
  <rect x="120" y="155" width="200" height="14" rx="7" fill="#eef3f9"/>
  <rect x="120" y="185" width="200" height="14" rx="7" fill="#eef3f9"/>
  <rect x="120" y="215" width="200" height="14" rx="7" fill="#eef3f9"/>

  <!-- Textarea -->
  <rect x="120" y="245" width="200" height="42" rx="8" fill="#eef3f9"/>

  <!-- Submit Button -->
  <rect x="170" y="305" width="100" height="34" rx="10" fill="url(#btnGrad)"/>
  <text x="200" y="327" font-size="13" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="600">
    SUBMIT
  </text>

  <!-- Side Document Icon -->
  <rect x="370" y="110" width="70" height="90" rx="10" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="385" y="130" width="40" height="8" rx="4" fill="#d6e4f5"/>
  <rect x="385" y="148" width="40" height="8" rx="4" fill="#d6e4f5"/>
  <rect x="385" y="166" width="26" height="8" rx="4" fill="#d6e4f5"/>

  <!-- Check / Tick -->
  <circle cx="405" cy="230" r="18" fill="#2bb673"/>
  <path d="M397 230 l6 6 l10 -12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
