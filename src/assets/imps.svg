<svg width="64" height="64" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Outer container -->
  <rect x="6" y="10" width="52" height="44" rx="6"
        stroke="#7A7A7A" stroke-width="3"/>

  <!-- Left arrow (send) -->
  <path d="M18 32h12"
        stroke="#7A7A7A" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 26l-6 6 6 6"
        stroke="#7A7A7A" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arrow (receive) -->
  <path d="M46 32H34"
        stroke="#7A7A7A" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 26l6 6-6 6"
        stroke="#7A7A7A" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rupee symbol -->
  <text x="32" y="38"
        font-size="14"
        text-anchor="middle"
        fill="#7A7A7A"
        font-family="Arial, sans-serif"
        font-weight="700">₹</text>

</svg>
