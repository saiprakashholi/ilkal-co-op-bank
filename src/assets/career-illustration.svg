<svg
  width="520"
  height="420"
  viewBox="0 0 520 420"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff" />
      <stop offset="100%" stop-color="#eef3f9" />
    </linearGradient>

    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bb673" />
      <stop offset="100%" stop-color="#23a266" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="16"
        flood-color="#000"
        flood-opacity="0.15"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="420" rx="24" fill="url(#bg)" />

  <!-- Resume Card -->
  <rect
    x="90"
    y="70"
    width="260"
    height="300"
    rx="18"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <!-- Header -->
  <rect x="120" y="95" width="200" height="16" rx="8" fill="#dbe7f6" />

  <!-- Text lines -->
  <rect x="120" y="130" width="200" height="14" rx="7" fill="#edf2f9" />
  <rect x="120" y="155" width="200" height="14" rx="7" fill="#edf2f9" />
  <rect x="120" y="180" width="160" height="14" rx="7" fill="#edf2f9" />

  <!-- Attachment -->
  <rect x="120" y="215" width="90" height="28" rx="8" fill="#edf2f9" />
  <rect x="130" y="223" width="30" height="12" rx="6" fill="#c9d9ee" />

  <!-- Message box -->
  <rect x="120" y="255" width="200" height="46" rx="10" fill="#edf2f9" />

  <!-- Submit button -->
  <rect x="170" y="315" width="100" height="34" rx="18" fill="url(#btn)" />
  <text
    x="200"
    y="337"
    font-size="13"
    fill="#ffffff"
    font-family="Inter, Arial, sans-serif"
    font-weight="600"
  >
    APPLY
  </text>

  <!-- Briefcase icon -->
  <rect
    x="370"
    y="150"
    width="80"
    height="60"
    rx="12"
    fill="#ffffff"
    filter="url(#shadow)"
  />
  <rect x="395" y="140" width="30" height="12" rx="6" fill="#c9d9ee" />
  <rect x="382" y="165" width="56" height="8" rx="4" fill="#dbe7f6" />

  <!-- Check badge -->
  <circle cx="410" cy="235" r="18" fill="#2bb673" />
  <path
    d="M402 235 l6 6 l10 -12"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
