<svg width="64" height="64" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Locker body -->
  <rect x="8" y="6" width="48" height="52" rx="6"
        stroke="#7A7A7A" stroke-width="3"/>

  <!-- Door inner panel -->
  <rect x="14" y="12" width="36" height="40" rx="4"
        stroke="#7A7A7A" stroke-width="2"/>

  <!-- Dial -->
  <circle cx="32" cy="32" r="8"
          stroke="#7A7A7A" stroke-width="3"/>

  <!-- Dial center -->
  <circle cx="32" cy="32" r="2.5" fill="#7A7A7A"/>

  <!-- Handle spokes -->
  <line x1="32" y1="24" x2="32" y2="18"
        stroke="#7A7A7A" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="46"
        stroke="#7A7A7A" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="32" x2="18" y2="32"
        stroke="#7A7A7A" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="46" y2="32"
        stroke="#7A7A7A" stroke-width="2" stroke-linecap="round"/>

</svg>
