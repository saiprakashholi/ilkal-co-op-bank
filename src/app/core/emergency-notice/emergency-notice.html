<div class="overlay" *ngIf="show">
  <div
    class="notice-card"
    [class.with-images]="hasImages()"
    [style.maxWidth.px]="hasImages() ? notice.images.maxWidthDesktop : 460"
  >
    <button class="close-btn" (click)="close()">
      {{ lang.t('core.emergency-notice', 'closeLabel') }}
    </button>

    <div class="icon">{{ getIcon() }}</div>

    <h2>{{ notice.title }}</h2>

    <p>{{ notice.message }}</p>

    <!-- 🔥 IMAGE SLIDER -->
    <div *ngIf="hasImages()" class="step-slider">
      <div class="step-track" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
        <div class="slide" *ngFor="let img of notice.images.items">
          <a [href]="img" target="_blank" rel="noopener noreferrer" class="slide-link">
            <img
              [src]="img"
              [attr.alt]="lang.t('core.emergency-notice', 'imageAlt')"
              [style.object-fit]="notice.images.fit"
              [style.--imgMaxHeightDesktop.px]="notice.images.maxHeightDesktop"
              [style.--imgMaxHeightMobile.px]="notice.images.maxHeightMobile"
            />
          </a>
        </div>
      </div>
    </div>

    <div class="time" *ngIf="notice.showValidity">
      {{ lang.t('core.emergency-notice', 'validFromLabel') }}
      <strong>{{ notice.effectiveStartTime | date : 'medium' }}</strong>
      {{ lang.t('core.emergency-notice', 'validToLabel') }}
      <strong>{{ notice.effectiveEndTime | date : 'medium' }}</strong>
    </div>

    <button class="ok-btn" (click)="close()">
      {{ lang.t('core.emergency-notice', 'okLabel') }}
    </button>
  </div>
</div>
