<div class="bank-brand">
  <!-- Left: Logo + Title -->
  <div class="left-section">
    <img
      [src]="lang.t('core.bank-brand', 'logoImage')"
      [attr.alt]="lang.t('core.bank-brand', 'logoAlt')"
      class="bank-logo"
      hoverZoom 
     (click)="goHome()"
     [attr.title]="lang.t('core.bank-brand', 'logoTitle')"
    />

    <div class="bank-info">
      <h1 class="bank-title">{{ lang.t('core.bank-brand', 'bankTitle') }}</h1>
      <p class="bank-sub">
        {{ lang.t('core.bank-brand', 'bankSubBefore') }} {{ bankStartedYear }}
      </p>
    </div>
  </div>

  <!-- Right: 50 Years Celebration Logo -->
  <div class="celebration-wrapper" *ngIf="showFounder">
    <img
      [src]="lang.t('core.bank-brand', 'celebrationImage')"
      [attr.alt]="lang.t('core.bank-brand', 'celebrationAlt')"
      class="celebration-logo"
      hoverZoom
    />
  </div>
</div>
