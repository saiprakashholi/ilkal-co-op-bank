<header class="header" role="banner">
  <div class="header-inner container">
    <!-- brand: logo only -->
    <!-- <a class="brand" href="/" aria-label="Ilkal Co-op Bank">
      <img src="assets/logo.png" alt="Ilkal Co-op Bank" class="logo-img" />
    </a> -->

    <!-- desktop nav -->
    <nav class="nav-desktop" aria-label="Primary">
      <ul>
        <li *ngFor="let item of menu">
          <a [routerLink]="item.url || '#'" (click)="closeMenu()">{{ item.label }}</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">

      <!-- mobile hamburger -->
      <button
        class="hamburger"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="mobileMenuOpen"
        (click)="toggleMenu()"
      >
        <!-- <span class="bar"></span>
        <span class="bar"></span>
         <span class="bar"></span> -->

         <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="5" r="2" fill="white"></circle>
    <circle cx="12" cy="12" r="2" fill="white"></circle>
    <circle cx="12" cy="19" r="2" fill="white"></circle>
  </svg>
        
      </button>
    </div>
  </div>

  <!-- mobile sliding nav -->
  <div
    class="mobile-nav-backdrop"
    [class.open]="mobileMenuOpen"
    (click)="closeMenu()"
    aria-hidden="{{ !mobileMenuOpen }}"
  ></div>

  <nav class="nav-mobile" [class.open]="mobileMenuOpen" aria-label="Mobile primary navigation">
    <ul>
      <li *ngFor="let item of menu">
        <a [routerLink]="item.url || '#'" (click)="closeMenu()">{{ item.label }}</a>
      </li>
    </ul>
  </nav>
</header>
