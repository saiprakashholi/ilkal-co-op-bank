<section class="locations-section">
  <h2 class="title">{{ lang.t('locations.locations', 'pageTitle') }}</h2>
  <p class="subtitle">
    {{ lang.t('locations.locations', 'pageSubtitle') }}
  </p>

  <div class="locations-grid">
    <div class="location-card" *ngFor="let branch of branches">
      <div class="image-wrapper">
        <img [src]="branch.image || fallbackImage" [alt]="branch.name" loading="lazy" />
      </div>

      <div class="card-content">
        <h3>{{ branch.name }}</h3>

        <p class="address" *ngIf="branch.address">
          {{ branch.address }}
        </p>

        <p class="phone" *ngIf="branch.phone">📞 {{ branch.phone }}</p>

        <div class="branch-actions">
          <a *ngIf="branch.phone" class="btn call" [href]="'tel:' + branch.phone">
            {{ lang.t('locations.locations', 'callLabel') }}
          </a>

          <a *ngIf="branch.location" class="btn visit" [href]="branch.location" target="_blank">
            {{ lang.t('locations.locations', 'visitLabel') }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
