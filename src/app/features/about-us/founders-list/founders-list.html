<section class="founders-wrap">
  <div class="container">
    <div class="heading-row">
      <h2 class="title">{{ lang.t('about-us.founders-list', 'title') }}</h2>

      <p class="intro">
        {{ description }}
      </p>
    </div>

    <!-- Responsive Grid -->
    <div class="founders-grid">
      <article class="founder-card" *ngFor="let f of founders">
        <div class="photo">
          <img loading="lazy" [src]="f.photo" [alt]="f.name" (error)="onImgError($event)" />
        </div>

        <div class="info">
          <h3 class="name">{{ f.name }}</h3>
          <p class="designation" *ngIf="f.designation">{{ f.designation }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
