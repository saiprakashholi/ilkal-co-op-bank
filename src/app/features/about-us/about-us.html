<div class="about-root">
  <!-- Hero header -->
  <header class="hero">
    <div class="hero-left">
      <div class="hero-top">
        <!-- Mobile hamburger -->
        <!-- <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button> -->
        <h1>{{ pageTitle }}</h1>
      </div>
      <nav class="breadcrumb">{{ pageBreadcrumb }}</nav>
    </div>

    <div class="hero-right">
      <!-- Use provided local image path -->
      <img
        [src]="lang.t('about-us', 'heroImage')"
        [attr.alt]="lang.t('about-us', 'heroImageAlt')"
      />
    </div>
  </header>

  <div class="container">
    <!-- Sidebar: becomes off-canvas on mobile -->
    <aside class="sidebar" [class.open]="sidebarOpen" [attr.aria-hidden]="!sidebarOpen">
      <div class="card">
        <h3>{{ lang.t('about-us', 'sidebarTitle') }}</h3>

        <ul class="menu">
          <!-- Executives (accordion on mobile) -->
          <li class="menu-section">
            <button
              class="menu-toggle"
              (click)="toggleExecutives()"
              [attr.aria-expanded]="execExpanded"
            >
              {{ lang.t('about-us', 'executivesTitle') }}
              <span class="chev" [class.open]="execExpanded">▸</span>
            </button>

            <ul class="submenu" [class.expanded]="execExpanded">
              <li>
                <a routerLink="/about-us/founders" routerLinkActive="active">
                  {{ lang.t('about-us', 'foundersNavLabel') }}
                </a>
              </li>
              <li>
                <a routerLink="/about-us/directors" routerLinkActive="active">
                  {{ lang.t('about-us', 'directorsNavLabel') }}
                </a>
              </li>
            </ul>
          </li>

          <!-- Financials -->
          <li class="menu-section">
            <button
              class="menu-toggle"
              (click)="toggleFinancials()"
              [attr.aria-expanded]="financialsExpanded"
            >
              {{ lang.t('about-us', 'financialsTitle') }}
              <span class="chev" [class.open]="financialsExpanded">▸</span>
            </button>

            <ul class="submenu" [class.expanded]="financialsExpanded">
              <li>
                <a routerLink="/agm" routerLinkActive="active">
                  {{ lang.t('about-us', 'keyIndicatorsNavLabel') }}
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </aside>

    <!-- overlay behind drawer on mobile -->
    <div class="overlay" *ngIf="isMobile() && sidebarOpen" (click)="toggleSidebar()"></div>

    <!-- main content area -->
    <main class="content">
      <!-- <h2 class="section-title">{{sectionTitle}}</h2> -->
      <div class="cards-wrap">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
