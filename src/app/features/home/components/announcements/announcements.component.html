<section class="announcements" aria-labelledby="announcements-title" role="region">
  <div class="container">
    <div class="ann-head">
      <h2 id="announcements-title" style="text-align: center;">
        {{ lang.t('home.announcements', 'title') }}
      </h2>
    </div>

    <ul class="ann-list" role="list">
      <li *ngFor="let a of items" class="ann-item" [attr.data-highlight]="a.highlight ? 'true' : 'false'">
        <a
          class="ann-link"
          [href]="announcementHref(a)"
          [attr.target]="hasLink(a) ? '_blank' : null"
          rel="noopener"
          [class.disabled]="!hasLink(a)"
          [attr.aria-disabled]="!hasLink(a) ? 'true' : null"
          (click)="onAnnouncementClick($event, a)"
        >
          <div class="ann-body">
            <div class="ann-left">
              <span class="ann-title">{{ a.title }}</span>
            </div>

            <div class="ann-right" aria-hidden="true">
              <span class="ann-date">{{ a.date || '' }}</span>
            </div>
          </div>
        </a>
      </li>
    </ul>
  </div>
</section>
