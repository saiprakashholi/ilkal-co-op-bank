<section class="page">
  <header class="hero">
    <img
      [src]="lang.t('deposits.interest-rate', 'heroImage')"
      alt="Savings Deposits"
      class="hero-image"
    />
    <h1>{{ lang.t('deposits.interest-rate', 'pageTitle') }}</h1>
    <p class="subtitle">{{ lang.t('deposits.interest-rate', 'pageSubtitle') }}</p>
  </header>

  <div class="rate-grid">
    <div class="rate-card" *ngFor="let d of deposits">
      <h3>{{ d.title }}</h3>
      <p class="rate">{{ d.rate }}%</p>
    </div>
  </div>
</section>

<div class="image-section">
  <h2>{{ lang.t('deposits.interest-rate', 'chartTitle') }}</h2>
  <br />

  <img
    [src]="lang.t('deposits.interest-rate', 'chartImage')"
    alt="Deposit Interest Rates Chart"
  />
</div>

<br />
<br />
