<section class="page">
  <header class="hero">
    <img src="/assets/deposits/fixed-deposit.jpg" alt="Savings Deposits" class="hero-image" />
    <h1>Deposit Interest Rates</h1>
    <p class="subtitle">Applicable from 01-02-2026</p>
  </header>

  <div class="rate-grid">
    <div class="rate-card" *ngFor="let d of deposits">
      <h3>{{ d.title }}</h3>
      <p class="rate">{{ d.rate }}%</p>
    </div>
  </div>
</section>

<div class="image-section">
  <h2>Deposit Interest Rate Chart</h2>
  <br />

  <img src="/assets/finance/deposit-interest-chart.jpeg" alt="Deposit Interest Rates Chart" />
</div>

<br />
