<section class="agm">
  <!-- HERO -->
  <div class="hero">
    <h1>{{ lang.t('others.others-agm', 'pageTitle') }}</h1>
    <p>{{ lang.t('others.others-agm', 'pageSubtitle') }}</p>
  </div>

  <!-- LIST -->
  <div class="list">
    <div class="item" *ngFor="let agm of agmReports">
      <div class="info">
        <div class="year">{{ agm.year }}</div>
        <div class="title">📑 {{ agm.title }}</div>
      </div>

      <div class="actions" [class.disabled]="!agm.url">
        <a class="btn btn-secondary" [href]="agm.url" target="_blank" rel="noopener">
          {{ lang.t('others.others-agm', 'viewLabel') }}
        </a>

        <a class="btn btn-primary" [href]="agm.url" download>
          {{ lang.t('others.others-agm', 'downloadLabel') }}
        </a>
      </div>
    </div>
  </div>
</section>
