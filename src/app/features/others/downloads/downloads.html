<section class="downloads">
  <!-- HERO -->
  <div class="hero">
    <h1>{{ lang.t('others.downloads', 'pageTitle') }}</h1>
    <p>{{ lang.t('others.downloads', 'pageSubtitle') }}</p>
  </div>

  <!-- LIST -->
  <div class="list">
    <div class="item" *ngFor="let doc of downloads">
      <div class="title">📄 {{ doc.title }}</div>

      <div [class.disabled]="!hasUrl(doc)" class="actions">
        <a
          [href]="viewUrl(doc)"
          target="_blank"
          rel="noopener"
          class="btn btn-secondary"
          [attr.aria-disabled]="!hasUrl(doc) ? 'true' : null"
          (click)="onDocumentClick($event, doc)"
        >
          {{ lang.t('others.downloads', 'viewLabel') }}
        </a>

        <a
          [href]="downloadUrl(doc)"
          target="_blank"
          rel="noopener"
          download
          class="btn btn-primary"
          [attr.aria-disabled]="!hasUrl(doc) ? 'true' : null"
          (click)="onDocumentClick($event, doc)"
        >
          {{ lang.t('others.downloads', 'downloadLabel') }}
        </a>
      </div>
    </div>
  </div>
</section>
