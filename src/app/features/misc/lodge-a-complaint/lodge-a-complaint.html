<section class="complaint-root">
  <div class="complaint-card">
    <!-- LEFT -->
    <div class="form-section">
      <!-- SUCCESS STATE -->
      <div *ngIf="submitted" class="success-box">
        <div class="icon">✔</div>
        <h3>{{ lang.t('misc.complaint', 'successTitle') }}</h3>
        <p>{{ lang.t('misc.complaint', 'successMsg') }}</p>

        <button class="secondary" (click)="resetForm()">
          {{ lang.t('misc.complaint', 'newComplaint') }}
        </button>
      </div>

      <!-- FORM -->
      <form *ngIf="!submitted" (submit)="onSubmit($event)">
        <h2>{{ lang.t('misc.complaint', 'title') }}</h2>
        <p class="subtitle">
          {{ lang.t('misc.complaint', 'subtitle') }}
        </p>

        <div class="row">
          <input
            type="text"
            name="name"
            [(ngModel)]="form.name"
            [placeholder]="lang.t('misc.complaint', 'name')"
          />
          <input
            type="email"
            name="email"
            [(ngModel)]="form.email"
            [placeholder]="lang.t('misc.complaint', 'email')"
          />
        </div>

        <div class="row">
          <input
            type="tel"
            name="phone"
            [(ngModel)]="form.phone"
            [placeholder]="lang.t('misc.complaint', 'phone')"
          />
          <input
            type="text"
            name="accountNo"
            [(ngModel)]="form.accountNo"
            [placeholder]="lang.t('misc.complaint', 'accountNo')"
          />
        </div>

        <div class="row">
          <select name="type" [(ngModel)]="form.type">
            <option value="">
              {{ lang.t('misc.complaint', 'selectType') }}
            </option>
            <option *ngFor="let t of complaintTypes" [value]="t.key">
              {{ lang.t('misc.complaint', 'type_' + t.key) }}
            </option>
          </select>

          <input
            type="text"
            name="rrn"
            [(ngModel)]="form.rrn"
            [placeholder]="lang.t('misc.complaint', 'rrn')"
          />
        </div>

        <div class="row full">
          <textarea
            rows="4"
            name="message"
            [(ngModel)]="form.message"
            [placeholder]="lang.t('misc.complaint', 'message')"
          ></textarea>
        </div>

        <div class="row full">
          <input type="file" disabled />
        </div>

        <button type="submit" class="primary" [disabled]="loading">
          {{ lang.t('misc.complaint', 'submit') }}
        </button>
      </form>
    </div>

    <!-- RIGHT -->
    <div class="image-section">
      <img
        [src]="lang.t('misc.complaint', 'illustrationImage')"
        [attr.alt]="lang.t('misc.complaint', 'illustrationAlt')"
      />
    </div>
  </div>
</section>
