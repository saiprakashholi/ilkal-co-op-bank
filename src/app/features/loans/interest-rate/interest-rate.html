<section class="page">
  <h1>{{ lang.t('loans.interest-rate', 'pageTitle') }}</h1>
  <p class="subtitle">{{ lang.t('loans.interest-rate', 'pageSubtitle') }}</p>

  <div class="loan-list">
    <div class="loan-card" *ngFor="let loan of loans">
      <div class="name">{{ loan.name }}</div>
      <div class="percent">{{ loan.rate }}%</div>
    </div>
  </div>
</section>
<div class="image-section">
  <h2>{{ lang.t('loans.interest-rate', 'chartTitle') }}</h2>
  <br />
  <img
    [src]="lang.t('loans.interest-rate', 'chartImage')"
    alt="Loan Interest Rates Chart"
  />
</div>

<br />
<br />
